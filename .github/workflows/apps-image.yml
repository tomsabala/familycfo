# Builds and pushes the image that apps.tom-sabala.dev runs: the `:apps-mount` tag, built with
# FAMILYCFO_BASE_PATH=/a/familycfo, which Vite inlines into the SPA and Fastify strips at runtime.
name: Publish apps-mount image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'docker/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/apps-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: apps-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/familycfo
  # Must match the slug in the gateway's frontend/src/apps/apps.json. It is baked into the
  # build: change it here and the app 404s behind the gateway.
  BASE_PATH: /a/familycfo

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # amd64 only: the gateway VPS is x86, and arm64 here means QEMU emulating a
          # better-sqlite3 source build for nothing.
          platforms: linux/amd64
          build-args: |
            FAMILYCFO_BASE_PATH=${{ env.BASE_PATH }}
          tags: |
            ${{ env.IMAGE }}:apps-mount
            ${{ env.IMAGE }}:apps-mount-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo ""
            echo '`${{ env.IMAGE }}:apps-mount` (moving) and `:apps-mount-${{ github.sha }}` (immutable)'
            echo ""
            echo "On the gateway VPS: \`docker pull ${{ env.IMAGE }}:apps-mount\`."
            echo "Running instances are recreated on their next request — the broker compares"
            echo "the container's image digest against the tag's current one."
          } >> "$GITHUB_STEP_SUMMARY"
